name: platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  api:
    image: ${API_IMAGE:-platform-api:local}
    build:
      context: ./server
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      STAGING_URL: ${STAGING_URL:-http://web:8080}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/ready']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  web:
    image: ${WEB_IMAGE:-platform-web:local}
    build:
      context: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /var/cache/nginx:size=32m,noexec,nosuid
      - /var/run:size=8m,noexec,nosuid
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${APP_PORT:-4173}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/api/ready']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [frontend, backend]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
