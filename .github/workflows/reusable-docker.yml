name: Reusable Docker Release

on:
  workflow_call:
    inputs:
      release-prefix:
        description: GHCR package prefix
        type: string
        required: false
        default: platform
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}
      web-digest-ref:
        value: ${{ jobs.release.outputs.web-digest-ref }}
      api-digest-ref:
        value: ${{ jobs.release.outputs.api-digest-ref }}

permissions:
  contents: read
  actions: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Scan, and Publish Images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      web-digest-ref: ${{ steps.refs.outputs.web_digest_ref }}
      api-digest-ref: ${{ steps.refs.outputs.api_digest_ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: web-dist
          path: dist/

      - name: Set CalVer metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ inputs.release-prefix }}
        run: |
          set -euo pipefail
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          WEB_IMAGE="ghcr.io/${OWNER}/${PREFIX}-web"
          API_IMAGE="ghcr.io/${OWNER}/${PREFIX}-api"
          MONTH="$(date -u +%Y.%m)"
          TAGS="$(gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PREFIX}-web/versions" --jq '.[].metadata.container.tags[]?' 2>/dev/null || gh api --paginate "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PREFIX}-web/versions" --jq '.[].metadata.container.tags[]?' 2>/dev/null || true)"
          MAX=0
          while IFS= read -r tag; do
            case "$tag" in
              "${MONTH}."*)
                N="${tag#"${MONTH}."}"
                [[ "$N" =~ ^[0-9]+$ ]] && [ "$N" -gt "$MAX" ] && MAX="$N"
                ;;
            esac
          done <<< "$TAGS"
          VERSION="${MONTH}.$((MAX + 1))"
          {
            echo "version=$VERSION"
            echo "web_image=$WEB_IMAGE"
            echo "api_image=$API_IMAGE"
            echo "web_tags=${WEB_IMAGE}:${VERSION},${WEB_IMAGE}:staging,${WEB_IMAGE}:sha-${GITHUB_SHA:0:7}"
            echo "api_tags=${API_IMAGE}:${VERSION},${API_IMAGE}:staging,${API_IMAGE}:sha-${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        id: web
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.web_tags }}
          cache-from: type=gha,scope=platform-web
          cache-to: type=gha,mode=max,scope=platform-web
          labels: |
            org.opencontainers.image.title=${{ inputs.release-prefix }}-web
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Build and push API
        id: api
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.api_tags }}
          cache-from: type=gha,scope=platform-api
          cache-to: type=gha,mode=max,scope=platform-api
          labels: |
            org.opencontainers.image.title=${{ inputs.release-prefix }}-api
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Set immutable references
        id: refs
        run: |
          echo "web_digest_ref=${{ steps.meta.outputs.web_image }}@${{ steps.web.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "api_digest_ref=${{ steps.meta.outputs.api_image }}@${{ steps.api.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Generate web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.refs.outputs.web_digest_ref }}
          format: cyclonedx-json
          output-file: web-sbom.cyclonedx.json
          upload-artifact: false
      - name: Generate API SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.refs.outputs.api_digest_ref }}
          format: cyclonedx-json
          output-file: api-sbom.cyclonedx.json
          upload-artifact: false

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.web_digest_ref }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.api_digest_ref }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Attest web image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.meta.outputs.web_image }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Attest API image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.meta.outputs.api_image }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Create release bundle
        run: |
          mkdir release
          cp compose.yml web-sbom.cyclonedx.json api-sbom.cyclonedx.json release/
          cp scripts/deploy-stack.sh scripts/rollback-stack.sh scripts/health-check.sh release/
          jq -n \
            --arg version "${{ steps.meta.outputs.version }}" \
            --arg sha "$GITHUB_SHA" \
            --arg web "${{ steps.refs.outputs.web_digest_ref }}" \
            --arg api "${{ steps.refs.outputs.api_digest_ref }}" \
            '{version:$version,sha:$sha,webImage:$web,apiImage:$api}' > release/release-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: release/
          retention-days: 30
