name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  packages: write
  id-token: write
  attestations: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Full Stack
    uses: ./.github/workflows/reusable-test.yml
    secrets: inherit

  security:
    name: Security Full Stack
    uses: ./.github/workflows/reusable-security.yml
    secrets: inherit

  docker:
    name: Package Release
    needs: [test, security]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-docker.yml
    with:
      release-prefix: platform
    secrets: inherit

  failure-ticket:
    name: Create Failure Ticket
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: always() && !cancelled() && (needs.test.result == 'failure' || needs.security.result == 'failure' || needs.docker.result == 'failure')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create or update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          FULL_STACK_TESTS: ${{ needs.test.result }}
          SECURITY_SCAN: ${{ needs.security.result }}
          CONTAINER_RELEASE: ${{ needs.docker.result }}
          COMPOSE_DEPLOY: skipped
        run: bash ./scripts/create-failure-ticket.sh
