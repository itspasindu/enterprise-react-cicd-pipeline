name: Reusable Deploy

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      STAGING_HOST:
        required: true
      STAGING_USER:
        required: true
      STAGING_SSH_KNOWN_HOSTS:
        required: true
      POSTGRES_PASSWORD:
        required: true
      TAILSCALE_AUTHKEY:
        required: false
      PIPELINE_GITHUB_TOKEN:
        required: false

permissions: {}

jobs:
  deploy:
    name: Deploy Full Stack to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ${{ inputs.artifact-name }}
          path: release/
      - name: Verify release archive
        run: |
          set -euo pipefail
          test -f release/release.json
          test -f release/checksums.txt
          test -f release/web/index.html
          test -f release/api/package.json
          test -x release/deploy-release.sh || chmod +x release/deploy-release.sh release/rollback-release.sh release/lib/host-process.sh
          (cd release && sha256sum -c checksums.txt)
          test "$(jq -r .runtime release/release.json)" = "host-node"
          echo "Release $(jq -r .version release/release.json) commit=$(jq -r .commit release/release.json)"
      - name: Require pipeline monitor token
        env:
          PIPELINE_GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
        run: |
          if [ -z "${PIPELINE_GITHUB_TOKEN:-}" ]; then
            echo "::error::Set repository/environment secret PIPELINE_GITHUB_TOKEN (fine-grained PAT with actions:read). Without it the staging API returns 503 on /api/pipelines/*."
            exit 1
          fi
      - name: Connect to Tailscale
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Configure known hosts
        env:
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" | sed 's/\r$//' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Resolve staging deploy root
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          DEPLOY_ROOT="$(
            ssh $SSH_OPTS "${USER}@${HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if [ -d /opt/platform ] && [ -w /opt/platform ]; then
            printf '%s\n' /opt/platform
          elif mkdir -p /opt/platform 2>/dev/null && [ -w /opt/platform ]; then
            printf '%s\n' /opt/platform
          else
            mkdir -p "$HOME/platform"
            printf '%s\n' "$HOME/platform"
          fi
          REMOTE
          )"
          echo "Using DEPLOY_ROOT=${DEPLOY_ROOT}"
          if [ "$DEPLOY_ROOT" != /opt/platform ]; then
            echo "::notice::/opt/platform is not writable for ${USER}; deploying to ${DEPLOY_ROOT}. For the preferred path, run on the VM: sudo mkdir -p /opt/platform && sudo chown -R ${USER}:${USER} /opt/platform"
          fi
          echo "DEPLOY_ROOT=${DEPLOY_ROOT}" >> "$GITHUB_ENV"
      - name: Require Node.js and jq on staging
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${USER}@${HOST}" 'command -v node >/dev/null && command -v jq >/dev/null && command -v curl >/dev/null && node -v'
      - name: Install release and restart API
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PIPELINE_GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          tar -C release -czf /tmp/platform-release.tgz .
          scp $SSH_OPTS /tmp/platform-release.tgz "${USER}@${HOST}:/tmp/platform-release.tgz"
          PASSWORD_B64="$(printf '%s' "$POSTGRES_PASSWORD" | base64 -w 0)"
          TOKEN_B64="$(printf '%s' "$PIPELINE_GITHUB_TOKEN" | base64 -w 0)"
          ssh $SSH_OPTS "${USER}@${HOST}" \
            "DEPLOY_ROOT=${DEPLOY_ROOT} POSTGRES_PASSWORD_B64=${PASSWORD_B64} GITHUB_TOKEN_B64=${TOKEN_B64} GITHUB_OWNER=${GITHUB_OWNER} GITHUB_REPO=${GITHUB_REPO} bash -s" <<'EOF'
          set -euo pipefail
          export POSTGRES_PASSWORD="$(printf '%s' "$POSTGRES_PASSWORD_B64" | base64 -d)"
          export GITHUB_TOKEN="$(printf '%s' "$GITHUB_TOKEN_B64" | base64 -d)"
          rm -rf /tmp/platform-incoming
          mkdir -p /tmp/platform-incoming
          tar -C /tmp/platform-incoming -xzf /tmp/platform-release.tgz
          chmod +x /tmp/platform-incoming/deploy-release.sh /tmp/platform-incoming/rollback-release.sh /tmp/platform-incoming/lib/host-process.sh
          echo "Deploy release=$(jq -er '.version' /tmp/platform-incoming/release.json) commit=$(jq -er '.commit' /tmp/platform-incoming/release.json)"
          RELEASE_DIR=/tmp/platform-incoming /tmp/platform-incoming/deploy-release.sh
          rm -rf /tmp/platform-incoming /tmp/platform-release.tgz
          EOF
      - name: External smoke tests
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          for path in / /about /contact /api/health /api/ready; do
            curl --fail --show-error --silent "http://${HOST}:4173${path}" >/dev/null
            echo "${path}: OK"
          done
          STATUS="$(curl --fail --show-error --silent "http://${HOST}:4173/api/pipelines/status")"
          echo "$STATUS" | jq -e '.configured == true' >/dev/null
          echo "/api/pipelines/status: configured"
          OVERVIEW_BODY="$(mktemp)"
          OVERVIEW_CODE="$(
            curl --show-error --silent --max-time 60 \
              -o "$OVERVIEW_BODY" -w '%{http_code}' \
              "http://${HOST}:4173/api/pipelines/overview" || true
          )"
          if [ "$OVERVIEW_CODE" != "200" ]; then
            echo "::error::/api/pipelines/overview returned HTTP ${OVERVIEW_CODE}"
            echo "Body:"
            head -c 2000 "$OVERVIEW_BODY" || true
            echo
            echo "Common causes:"
            echo "  - the host cannot reach api.github.com"
            echo "  - PIPELINE_GITHUB_TOKEN missing actions:read (and ideally issues:read)"
            exit 1
          fi
          echo "/api/pipelines/overview: OK"
