name: Reusable Deploy

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      STAGING_HOST:
        required: true
      STAGING_USER:
        required: true
      STAGING_SSH_KNOWN_HOSTS:
        required: true
      POSTGRES_PASSWORD:
        required: true
      TAILSCALE_AUTHKEY:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy Full Stack to Staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            scripts/deploy-stack.sh
            scripts/rollback-stack.sh
            scripts/health-check.sh
            scripts/free-host-port.sh
            scripts/transfer-release-images.sh
            scripts/lib/image-archive.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ${{ inputs.artifact-name }}
          path: release/
      - name: Overlay latest deploy scripts into release bundle
        run: |
          test -d release
          cp scripts/deploy-stack.sh scripts/rollback-stack.sh scripts/health-check.sh scripts/free-host-port.sh release/
          chmod +x release/deploy-stack.sh release/rollback-stack.sh release/health-check.sh release/free-host-port.sh
      - name: Connect to Tailscale
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Configure known hosts
        env:
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" | sed 's/\r$//' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Pull immutable images on runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          WEB_IMAGE_DIGEST="$(jq -er '.webImage' release/release-metadata.json)"
          API_IMAGE_DIGEST="$(jq -er '.apiImage' release/release-metadata.json)"
          docker pull "$WEB_IMAGE_DIGEST"
          docker pull "$API_IMAGE_DIGEST"

          WEB_IMAGE="platform-web:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          API_IMAGE="platform-api:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$WEB_IMAGE_DIGEST" "$WEB_IMAGE"
          docker tag "$API_IMAGE_DIGEST" "$API_IMAGE"

          TMP_METADATA="$(mktemp)"
          jq --arg web "$WEB_IMAGE" --arg api "$API_IMAGE" \
            '.webImage = $web | .apiImage = $api' \
            release/release-metadata.json > "$TMP_METADATA"
          mv "$TMP_METADATA" release/release-metadata.json

          printf 'WEB_IMAGE=%s\nAPI_IMAGE=%s\n' "$WEB_IMAGE" "$API_IMAGE" >> "$GITHUB_ENV"
      - name: Resolve staging deploy root
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          DEPLOY_ROOT="$(
            ssh $SSH_OPTS "${USER}@${HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if [ -d /opt/platform ] && [ -w /opt/platform ]; then
            printf '%s\n' /opt/platform
          elif mkdir -p /opt/platform 2>/dev/null && [ -w /opt/platform ]; then
            printf '%s\n' /opt/platform
          else
            mkdir -p "$HOME/platform"
            printf '%s\n' "$HOME/platform"
          fi
          REMOTE
          )"
          echo "Using DEPLOY_ROOT=${DEPLOY_ROOT}"
          if [ "$DEPLOY_ROOT" != /opt/platform ]; then
            echo "::notice::/opt/platform is not writable for ${USER}; deploying to ${DEPLOY_ROOT}. For the preferred path, run on the VM: sudo mkdir -p /opt/platform && sudo chown -R ${USER}:${USER} /opt/platform"
          fi
          echo "DEPLOY_ROOT=${DEPLOY_ROOT}" >> "$GITHUB_ENV"
      - name: Ensure staging Docker Compose v2
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          # v2.32.4: `up`/`create` accept --no-build; `run` rejects it (exit 16).
          # deploy-stack.sh migrations use `run --pull never` for that reason.
          COMPOSE_VERSION: v2.32.4
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          ssh $SSH_OPTS "${USER}@${HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          command -v docker >/dev/null || { echo "Docker is required on staging"; exit 1; }
          command -v jq >/dev/null || { echo "jq is required on staging (sudo apt-get install -y jq)"; exit 1; }
          docker info >/dev/null
          EOF

          if ssh $SSH_OPTS "${USER}@${HOST}" 'docker compose version >/dev/null 2>&1'; then
            ssh $SSH_OPTS "${USER}@${HOST}" 'docker compose version'
            exit 0
          fi

          echo "Compose v2 missing on staging; bootstrapping via runner download + SCP (VM needs no outbound DNS)."
          REMOTE_UNAME="$(ssh $SSH_OPTS "${USER}@${HOST}" 'uname -m')"
          case "$REMOTE_UNAME" in
            x86_64) ARCH=x86_64 ;;
            aarch64|arm64) ARCH=aarch64 ;;
            armv7l) ARCH=armv7 ;;
            *) echo "Unsupported staging arch: $REMOTE_UNAME"; exit 1 ;;
          esac

          curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-${ARCH}" \
            -o /tmp/docker-compose
          chmod +x /tmp/docker-compose
          ssh $SSH_OPTS "${USER}@${HOST}" 'mkdir -p "$HOME/.docker/cli-plugins"'
          scp $SSH_OPTS /tmp/docker-compose "${USER}@${HOST}:.docker/cli-plugins/docker-compose"
          ssh $SSH_OPTS "${USER}@${HOST}" 'chmod +x "$HOME/.docker/cli-plugins/docker-compose" && docker compose version'
      - name: Transfer bundle and images
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          VERSION="$(jq -er '.version' release/release-metadata.json)"
          export VERSION
          export LOCAL_WEB="platform-web:${VERSION}"
          export LOCAL_API="platform-api:${VERSION}"
          export RELEASE_DIR=release
          # Separate archives. Saving both image IDs in one stream left the VM
          # with a single loaded image and no tag for the web config digest.
          bash scripts/transfer-release-images.sh
      - name: Free staging app port
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          APP_PORT: '4173'
        run: |
          set -euo pipefail
          test -f release/free-host-port.sh
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # Same helper deploy-stack.sh and rollback-stack.sh source. It stops
          # Docker publishers and leftover host listeners (including a parent
          # that restarts node/vite) and only returns once APP_PORT stays free.
          ssh $SSH_OPTS "${USER}@${HOST}" "APP_PORT=${APP_PORT} bash '${DEPLOY_ROOT}/free-host-port.sh'"
      - name: Deploy Compose stack
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          PASSWORD_B64="$(printf '%s' "$POSTGRES_PASSWORD" | base64 -w 0)"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${USER}@${HOST}" "DEPLOY_ROOT=${DEPLOY_ROOT} POSTGRES_PASSWORD_B64=${PASSWORD_B64} bash -s" <<'EOF'
          set -euo pipefail
          command -v jq >/dev/null || { echo "jq is required on staging"; exit 1; }
          export POSTGRES_PASSWORD="$(printf '%s' "$POSTGRES_PASSWORD_B64" | base64 -d)"
          echo "Deploy metadata webImage=$(jq -er '.webImage' "$DEPLOY_ROOT/release-metadata.json")"
          chmod +x "$DEPLOY_ROOT/deploy-stack.sh" "$DEPLOY_ROOT/rollback-stack.sh" "$DEPLOY_ROOT/health-check.sh"
          "$DEPLOY_ROOT/deploy-stack.sh"
          EOF
      - name: External smoke tests
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          for path in / /about /contact /api/health /api/ready; do
            curl --fail --show-error --silent "http://${HOST}:4173${path}" >/dev/null
            echo "${path}: OK"
          done
