name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Successful CI run ID containing release-bundle
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read
  issues: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      source-run-id: ${{ steps.run.outputs.id }}
    steps:
      - name: Select CI run
        id: run
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.ci-run-id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "id=$MANUAL_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "id=$AUTO_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Download CI release bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-bundle --dir release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cd-release
          path: release/
          retention-days: 7

  deploy:
    name: Deploy Staging
    needs: prepare
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      artifact-name: cd-release
    secrets: inherit

  rollback:
    name: Roll Back Staging
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    uses: ./.github/workflows/reusable-rollback.yml
    secrets: inherit

  wiki-report:
    name: Publish Deployment Wiki Report
    runs-on: ubuntu-latest
    needs: [prepare, deploy, rollback]
    if: always() && needs.prepare.result == 'success'
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish full-stack report
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: main
          WORKFLOW_NAME: Full-Stack CD
          FULL_STACK_TESTS: success
          SECURITY_SCAN: success
          CONTAINER_RELEASE: success
          COMPOSE_DEPLOY: ${{ needs.deploy.result }}
          FAILURE_TICKET: ${{ needs.rollback.result }}
        run: bash ./scripts/publish-wiki-report.sh

  deployment-ticket:
    name: Create Deployment Failure Ticket
    runs-on: ubuntu-latest
    needs: [prepare, deploy, rollback]
    if: always() && needs.deploy.result == 'failure'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create or update deployment issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: main
          WORKFLOW_NAME: CD
          FULL_STACK_TESTS: success
          SECURITY_SCAN: success
          CONTAINER_RELEASE: success
          COMPOSE_DEPLOY: failure
        run: bash ./scripts/create-failure-ticket.sh
