name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

  # ==========================================
  # STAGE 2: Security Scanning
  # ==========================================
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Audit dependencies (fail on high/critical only)
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Run npm audit fix check
        run: |
          npm audit fix --dry-run 2>&1 || true

      - name: Check for secrets (pull request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug --only-verified

      - name: Check for secrets (push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

      - name: Check for secrets (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================
  # STAGE 2.5: Await developer fix choice
  # Auto-fix is NOT applied automatically.
  # Developers choose on the failure Issue:
  #   - label "fix/auto"   → Developer Fix Choice workflow runs auto-fix
  #   - label "fix/manual" → developer fixes locally / via PR
  # Or run workflow "Developer Fix Choice" manually (workflow_dispatch).
  # ==========================================
  await-fix-decision:
    name: Await Developer Fix Decision
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    if: |
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (needs.code-quality.result == 'failure' || needs.security-scan.result == 'failure')
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Post fix-choice guidance on / create failure ticket
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          CODE_QUALITY: ${{ needs.code-quality.result }}
          SECURITY_SCAN: ${{ needs.security-scan.result }}
          UNIT_TESTS: skipped
          BUILD: skipped
          E2E_TESTS: skipped
          DEPLOY_STAGING: skipped
        run: |
          chmod +x ./scripts/create-failure-ticket.sh
          ./scripts/create-failure-ticket.sh

      - name: Remind that pipeline is waiting for developer choice
        run: |
          echo "::notice::Quality/security failed. Choose a fix path on the GitHub Issue:"
          echo "  - Add label 'fix/auto' for automated lint/format/audit fix + commit"
          echo "  - Add label 'fix/manual' to confirm you will fix manually"
          echo "Or run Actions → 'Developer Fix Choice' → Run workflow."

  # ==========================================
  # STAGE 3: Unit & Integration Tests
  # ==========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ==========================================
  # STAGE 4: Build Verification
  # ==========================================
  build:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Analyze bundle size
        run: |
          echo "=== Bundle Size Analysis ==="
          du -sh dist/
          echo ""
          echo "=== Largest Files ==="
          find dist -type f -exec du -h {} + | sort -rh | head -20

      - name: Check for build errors
        run: |
          if [ ! -d "dist" ]; then
            echo "Build directory not found!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "index.html not found in build!"
            exit 1
          fi
          echo "Build verification passed ✓"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          retention-days: 7

  # ==========================================
  # STAGE 5: E2E Tests
  # ==========================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ==========================================
  # STAGE 6: Deploy to Staging (EC2)
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, e2e-tests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup for rollback
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            if [ -d "/opt/enterprise-react-app" ]; then
              echo "Creating backup of current deployment..."
              sudo rm -rf /opt/enterprise-react-app_backup
              sudo cp -a /opt/enterprise-react-app /opt/enterprise-react-app_backup
            else
              echo "No existing deployment found to backup."
            fi
          EOF

      - name: Sync project files to staging EC2
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            ./ ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/enterprise-react-app/

      - name: Deploy to staging server
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            set -e
            cd /opt/enterprise-react-app
            chmod +x ./scripts/deploy.sh ./scripts/health-check.sh
            ./scripts/deploy.sh staging
          EOF

      - name: Run health checks
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 15

          MAX_RETRIES=10
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ secrets.STAGING_HOST }}:4173/" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed ✓"
              exit 0
            fi
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Status $STATUS, retrying in 10s..."
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          echo "Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Run smoke tests
        run: |
          # Check all pages load correctly
          for page in "/" "/about" "/contact"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ secrets.STAGING_HOST }}:4173$page" || echo "000")
            if [ "$STATUS" != "200" ]; then
              echo "Page $page returned status $STATUS"
              exit 1
            fi
            echo "Page $page: OK ($STATUS)"
          done

          # Check security headers
          HEADERS=$(curl -sI "http://${{ secrets.STAGING_HOST }}:4173/")
          echo "$HEADERS" | grep -i "content-security-policy" || echo "WARNING: CSP header missing"
          echo "$HEADERS" | grep -i "x-frame-options" || echo "WARNING: X-Frame-Options missing"
          echo "$HEADERS" | grep -i "x-content-type-options" || echo "WARNING: X-Content-Type-Options missing"

          echo "All smoke tests passed ✓"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment or tests failed. Initiating rollback..."
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            if [ -d "/opt/enterprise-react-app_backup" ]; then
              echo "Restoring from backup..."
              sudo rm -rf /opt/enterprise-react-app
              sudo mv /opt/enterprise-react-app_backup /opt/enterprise-react-app
              cd /opt/enterprise-react-app
              
              echo "Restarting application with previous version..."
              pm2 delete "enterprise-react-app" >/dev/null 2>&1 || true
              pm2 start "npm run start -- --host 0.0.0.0 --port 4173" --name "enterprise-react-app"
              pm2 save
              echo "Rollback complete."
            else
              echo "No backup found. Cannot rollback."
            fi
          EOF

  # ==========================================
  # STAGE 7: Create GitHub Issue tickets on failure
  # ==========================================
  create-failure-ticket:
    name: Create Failure Ticket
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - security-scan
      - unit-tests
      - build
      - e2e-tests
      - deploy-staging
    if: |
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (
        needs.code-quality.result == 'failure' ||
        needs.security-scan.result == 'failure' ||
        needs.unit-tests.result == 'failure' ||
        needs.build.result == 'failure' ||
        needs.e2e-tests.result == 'failure' ||
        needs.deploy-staging.result == 'failure'
      )
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Issue for failed pipeline stages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          CODE_QUALITY: ${{ needs.code-quality.result }}
          SECURITY_SCAN: ${{ needs.security-scan.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          BUILD: ${{ needs.build.result }}
          E2E_TESTS: ${{ needs.e2e-tests.result }}
          DEPLOY_STAGING: ${{ needs.deploy-staging.result }}
        run: |
          chmod +x ./scripts/create-failure-ticket.sh
          ./scripts/create-failure-ticket.sh

  # ==========================================
  # STAGE 8: Publish final report to GitHub Wiki
  # ==========================================
  publish-wiki-report:
    name: Publish Wiki Report
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - security-scan
      - await-fix-decision
      - unit-tests
      - build
      - e2e-tests
      - deploy-staging
      - create-failure-ticket
    if: |
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish final pipeline report to Wiki
        env:
          # Prefer a PAT/fine-grained token with Wiki write access.
          # GITHUB_TOKEN often cannot push to *.wiki.git.
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          CODE_QUALITY: ${{ needs.code-quality.result }}
          SECURITY_SCAN: ${{ needs.security-scan.result }}
          AWAIT_FIX_DECISION: ${{ needs.await-fix-decision.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          BUILD: ${{ needs.build.result }}
          E2E_TESTS: ${{ needs.e2e-tests.result }}
          DEPLOY_STAGING: ${{ needs.deploy-staging.result }}
          FAILURE_TICKET: ${{ needs.create-failure-ticket.result }}
        run: |
          chmod +x ./scripts/publish-wiki-report.sh
          ./scripts/publish-wiki-report.sh

