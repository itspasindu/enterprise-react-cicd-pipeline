name: Reusable Security

on:
  workflow_call:

# Caller must grant at least contents:read + security-events:write (see ci.yml).
# Individual jobs further restrict where SARIF upload is not needed.
permissions: {}

jobs:
  dependencies:
    name: Dependency and Secret Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: npm
      # Gate on production deps only. Tailwind CSS v3 still pulls braces/micromatch
      # (GHSA-vfj7-8cjw-p6xm) with no patched braces release; fixing requires Tailwind v4.
      - name: Audit web production dependencies
        run: npm ci --no-audit && npm audit --omit=dev --audit-level=high
      - name: Report web full dependency audit
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Full web audit reported issues (often Tailwind v3 / braces with no patched release). Production audit above is the merge gate."
          fi
          exit 0
      - name: Audit API production dependencies
        working-directory: server
        run: npm ci --no-audit && npm audit --omit=dev --audit-level=high
      - name: Report API full dependency audit
        working-directory: server
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Full API audit reported issues. Production audit above is the merge gate."
          fi
          exit 0
      - name: Scan verified secrets
        env:
          TRUFFLEHOG_VERSION: '3.96.0'
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          trap 'rm -rf "$scanner_dir"' EXIT
          archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          curl -fsSL "$base/$archive" -o "$scanner_dir/$archive"
          curl -fsSL "$base/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt" -o "$scanner_dir/checksums.txt"
          (
            cd "$scanner_dir"
            awk -v archive="$archive" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' checksums.txt > selected-checksum.txt
            sha256sum -c selected-checksum.txt
          )
          tar -xzf "$scanner_dir/$archive" -C "$scanner_dir" trufflehog
          "$scanner_dir/trufflehog" git "file://$GITHUB_WORKSPACE" \
            --only-verified --fail --no-update --github-actions

  code-scanning:
    name: CodeQL and Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@1b549b9259bda1cb5ddde3b41741a82a2d15a841 # v3.28.13
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@1b549b9259bda1cb5ddde3b41741a82a2d15a841 # v3.28.13
      - uses: github/codeql-action/analyze@1b549b9259bda1cb5ddde3b41741a82a2d15a841 # v3.28.13
        with:
          category: /language:javascript-typescript
      - name: Trivy repository scan
        run: |
          set -euo pipefail
          version=0.76.1
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C "$HOME/.local/bin" trivy
          "$HOME/.local/bin/trivy" fs --format sarif --output trivy-results.sarif --severity CRITICAL,HIGH .
      - uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841 # v3.28.13
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
