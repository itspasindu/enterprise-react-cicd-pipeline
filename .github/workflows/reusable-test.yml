name: Reusable Tests

on:
  workflow_call:

# All jobs only need checkout + Actions artifacts (no GitHub API writes).
permissions:
  contents: read

jobs:
  web:
    name: Web Quality and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Lint, format, and type check
        run: npm run lint && npm run format:check && npm run typecheck
      - name: Unit tests
        run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-coverage
          path: coverage/
          retention-days: 7

  api:
    name: API Unit and PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://platform:test-password@127.0.0.1:5432/platform_test
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Install PostgreSQL
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-install-postgres.sh platform_test platform test-password
      - name: Lint API
        run: npm run lint
      - name: Apply migrations
        run: npm run migrate
      - name: API unit and integration tests
        run: npm run test && npm run test:integration

  build:
    name: Build Web Artifact
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Build once
        env:
          VITE_API_URL: /api
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  full-stack-e2e:
    name: Full-Stack E2E
    runs-on: ubuntu-latest
    needs: build
    env:
      POSTGRES_PASSWORD: test-password
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_USE_REAL_API: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: web-dist
          path: dist/
      - run: npx playwright install --with-deps
      - name: Install PostgreSQL
        run: bash scripts/ci-install-postgres.sh platform platform test-password
      - name: Start API and run cross-browser E2E
        env:
          DATABASE_URL: postgres://platform:test-password@127.0.0.1:5432/platform
          PORT: 4173
          WEB_ROOT: ${{ github.workspace }}/dist
          NODE_ENV: test
        run: |
          set -euo pipefail
          npm ci --prefix server --omit=dev
          npm run migrate --prefix server
          npm start --prefix server > /tmp/platform-api.log 2>&1 &
          echo $! > /tmp/platform-api.pid
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "API failed to become ready" >&2
            cat /tmp/platform-api.log >&2 || true
            exit 1
          fi
          npm run test:e2e
      - name: API diagnostics
        if: failure()
        run: cat /tmp/platform-api.log || true
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/platform-api.pid ]; then
            kill "$(cat /tmp/platform-api.pid)" || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
