name: Reusable Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web Quality and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Lint, format, and type check
        run: npm run lint && npm run format:check && npm run typecheck
      - name: Unit tests
        run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-coverage
          path: coverage/
          retention-days: 7

  api:
    name: API Unit and PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: platform_test
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://platform:test-password@localhost:5432/platform_test
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Lint API
        run: npm run lint
      - name: Apply migrations
        run: npm run migrate
      - name: API unit and integration tests
        run: npm run test && npm run test:integration

  build:
    name: Build Web Artifact
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Build once
        env:
          VITE_API_URL: /api
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  full-stack-e2e:
    name: Full-Stack E2E
    runs-on: ubuntu-latest
    needs: build
    env:
      POSTGRES_PASSWORD: test-password
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_USE_REAL_API: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: web-dist
          path: dist/
      - run: npx playwright install --with-deps
      - name: Start full stack
        run: docker compose -f compose.yml up -d --build --wait
      - name: Run cross-browser E2E
        run: npm run test:e2e
      - name: Compose diagnostics
        if: failure()
        run: docker compose -f compose.yml ps && docker compose -f compose.yml logs --no-color
      - name: Stop full stack
        if: always()
        run: docker compose -f compose.yml down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
