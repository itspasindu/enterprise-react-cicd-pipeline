name: Reusable Release

on:
  workflow_call:

permissions: {}

jobs:
  release:
    name: Build Release Archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: npm
      - name: Install production web dependencies for the SBOM
        run: npm ci --omit=dev
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: web-dist
          path: dist/
      - name: Set calendar version
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MONTH="$(date -u +%Y.%m)"
          NAMES="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts" --jq '.artifacts[].name' 2>/dev/null || true)"
          MAX=0
          while IFS= read -r name; do
            case "$name" in
              "release-${MONTH}."*)
                rest="${name#release-${MONTH}.}"
                N="${rest%%-*}"
                [[ "$N" =~ ^[0-9]+$ ]] && [ "$N" -gt "$MAX" ] && MAX="$N"
                ;;
            esac
          done <<< "$NAMES"
          VERSION="${MONTH}.$((MAX + 1))"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version ${VERSION}"
      - name: Pack release archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/create-release-bundle.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: release/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: release/
          retention-days: 30
