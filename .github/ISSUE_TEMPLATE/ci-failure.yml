name: CI/CD Failure Ticket
description: Track a pipeline failure detected by the CI/CD workflow
title: "[CI Failure]: "
labels: ["ci-failure", "bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for pipeline failures. The CI workflow also creates detailed tickets automatically on `main`.

  - type: dropdown
    id: failed-stage
    attributes:
      label: Failed stage(s)
      description: Which pipeline stage(s) failed?
      multiple: true
      options:
        - Code Quality Checks
        - Security Analysis
        - Unit Tests
        - Build & Bundle Analysis
        - E2E Tests
        - Build & Push Docker Image
        - Deploy to Staging
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (security / deploy)
        - High (blocks main)
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: workflow-run
    attributes:
      label: Workflow run URL
      description: Link to the failed GitHub Actions run
      placeholder: https://github.com/org/repo/actions/runs/123456
    validations:
      required: false

  - type: input
    id: commit-sha
    attributes:
      label: Commit SHA
      placeholder: abc1234
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Failure summary
      description: What failed and key error messages from the job logs
      placeholder: E2E — navigation.spec.js failed on Mobile Safari (strict mode violation)...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce locally
      description: Commands to reproduce on the failing commit
      value: |
        git checkout <sha>
        npm ci
        # Run the failing stage command (lint / test / build / test:e2e)
    validations:
      required: false

  - type: dropdown
    id: fix-path
    attributes:
      label: Fix path
      description: How will this be resolved?
      options:
        - fix/auto — automated lint/format only
        - fix/manual — developer fix via PR
        - Not chosen yet
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Resolution checklist
      options:
        - label: Job logs reviewed
        - label: Artifacts downloaded (if applicable)
        - label: Fix path chosen (fix/auto or fix/manual)
        - label: Root cause identified
        - label: Fix merged to main
        - label: CI run is green on main
        - label: Related duplicate tickets closed
